name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4   # handles Gradle + dependency caching

      - name: Assemble Project
        run: ./gradlew assemble

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Android Lint Check
        run: ./gradlew lint

      - name: Detekt Compliance Check
        run: |
          ./gradlew detekt
          ./gradlew -p build-logic detekt

      - name: Kotlin Lint Check
        run: |
          ./gradlew ktlintCheck
          ./gradlew -p build-logic ktlintCheck

      - name: Binary compatibility check
        run: ./gradlew releaseApiCheck

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results*.html
            **/build/reports/detekt/
            **/build/reports/ktlint/

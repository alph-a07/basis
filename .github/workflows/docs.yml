name: Docs CI & Preview

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build docs-runtime JS artifacts
        run: ./gradlew :docs-runtime:jsBrowserProductionLibraryDistribution

      - name: Generate docs JSON documents
        run: ./gradlew :docs:docs-extract:generateDocsJson

      - name: Generate docs-model TypeScript types
        run: npm run generate:types --workspace @basis/docs-model

      - name: Generate fonts catalog
        run: npm run generate:fonts-catalog --workspace docs-site

      - name: Typecheck Astro docs site
        run: npm run check --workspace docs-site

      - name: Run documentation test aggregate
        run: ./gradlew docsTests

      - name: Verify specimen token variables and contracts
        run: |
          npm run check:specimens --workspace docs-site
          npm run test:specimens --workspace docs-site

      - name: Upload Pagefind and site build artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site-dist
          path: docs/docs-site/dist/

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/docs-site/dist/

      - name: Deploy GitHub Pages Preview
        id: deployment
        if: github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4

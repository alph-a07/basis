name: Docs CI & Preview

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build docs-runtime JS artifacts
        run: ./gradlew :docs-runtime:compileKotlinJs

      - name: Validate docs model and schemas
        run: npm test --workspace @basis/docs-model

      - name: Typecheck Astro docs site
        run: npm run check --workspace docs-site

      - name: Validate docs loader and data
        run: npm run test:loader --workspace docs-site

      - name: Build static docs site (Astro + Pagefind)
        run: npm run build --workspace docs-site

      - name: Run layout accessibility audit (axe-core)
        run: npm run test:a11y --workspace docs-site

      - name: Run design pass and specification audit
        run: npm run test:design --workspace docs-site

      - name: Run internal link checker and stub audit
        run: npm run test:links --workspace docs-site

      - name: Verify specimen token variables and contracts
        run: |
          npm run check:specimens --workspace docs-site
          npm run test:specimens --workspace docs-site

      - name: Upload Pagefind and site build artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site-dist
          path: docs/docs-site/dist/

      - name: Deploy GitHub Pages Preview
        if: github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4

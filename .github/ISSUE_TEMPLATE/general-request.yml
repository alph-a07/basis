name: "Report or Request"
description: Report a bug, request a feature, suggest an enhancement, or share something else about Basis
title: "[Feature | Bug | Enhancement | Others] <title>"
labels: [ "status: triage" ]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to contribute to **Basis**! Pick the **type** below, then fill in the summary and
        the section(s) that apply to it. You can leave the other sections blank.

  - type: dropdown
    id: type
    attributes:
      label: What kind of issue is this?
      options:
        - Bug report
        - Feature request
        - Enhancement to existing behavior
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which area does this relate to?
      options:
        - Atom (button, checkbox, badge…)
        - Molecule (search field, form group…)
        - Component (bottom sheet, top bar, dialog…)
        - Pattern
        - Design tokens (basis-tokens)
        - Theming (BasisThemeConfig, light / dark)
        - Accessibility (TalkBack, touch targets, font scale)
        - Demo app
        - Documentation site
        - Build / publishing (Gradle, Maven)
        - Not sure
    validations:
      required: true

  - type: input
    id: name
    attributes:
      label: Component or item name (if known)
      placeholder: "e.g. BasisButton, BasisTextField"

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear, concise description of the bug, request, or idea.
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        ### Bug reports only

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal Composable snippet, or a fork of the demo app that reproduces it, is the fastest way to get a fix.
      placeholder: |
        1. Render '...'
        2. Tap on '...'
        3. See error

  - type: textarea
    id: expected-actual
    attributes:
      label: Expected vs. actual behavior
      placeholder: |
        Expected: ...
        Actual: ...

  - type: checkboxes
    id: conditions
    attributes:
      label: Reproduces under
      description: Tick everything that applies. Leave blank if unsure.
      options:
        - label: Light theme
        - label: Dark theme
        - label: Large font scale
        - label: TalkBack enabled
        - label: RTL layout
        - label: Only on a specific API level or device (add details below)

  - type: textarea
    id: theme-config
    attributes:
      label: BasisThemeConfig in use
      description: For theming or color related bugs, paste the config you're passing to the theme.
      render: kotlin

  - type: textarea
    id: logs
    attributes:
      label: Logs, stack traces, or screenshots
      description: Paste Logcat output or drag in screenshots / screen recordings.
      render: shell

  - type: input
    id: version
    attributes:
      label: Basis version
      placeholder: "e.g. 0.3.0"

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Device or emulator, Android version / API level, and your build toolchain.
      placeholder: |
        - Device: Pixel 8 (emulator)
        - Android: 15 (API 35)
        - Kotlin: 2.x
        - Compose BOM: 20xx.xx.xx
        - AGP: 8.x
        - Gradle: 8.x

  - type: markdown
    attributes:
      value: |
        ---
        ### Feature requests & enhancements only

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What are you trying to build, and what's getting in your way? For enhancements, what is the current behavior?

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe what you'd like to see. Sketches, mockups, or API examples (Kotlin signatures) are welcome.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other approaches you've tried, including customizing it on your side.

  - type: dropdown
    id: impact
    attributes:
      label: How much does this affect you?
      options:
        - Blocking my work
        - Significant, but I have a workaround
        - Minor / nice to have
        - Not applicable

  - type: markdown
    attributes:
      value: |
        ---
        ### Anything else

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Links, related issues, or anything else that helps.

  - type: dropdown
    id: contribute
    attributes:
      label: Would you be willing to help?
      options:
        - "Yes, I can submit a pull request"
        - "Yes, I can help test or review"
        - "No, but happy to answer questions"

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I checked the documentation site and the demo app.
          required: true
        - label: I agree to follow the project's Code of Conduct.
          required: true

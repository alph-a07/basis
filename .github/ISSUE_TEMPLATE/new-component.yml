name: "New Component (maintainers only)"
description: Maintainers only. Track the design, build, and release of a new Basis component (feature-level UI built from molecules and atoms)
title: "[Component]: "
labels: [ "area: component", "type: new", "status: triage" ]
body:
  - type: markdown
    attributes:
      value: |
        > 🔒 **Maintainers only.** Issues opened with this form by anyone without write access are closed automatically.
        > If you'd like to suggest something new, please use the **Report / Request** form instead.

        Use this template to **track** a new higher-level component (e.g. TopBar, BottomSheet, Dialog, LoginForm).
        Components compose molecules and atoms and may own layout, state, and data handling.

        **Title format:** `[Component]: BasisBottomSheet`. Type the component's name after the prefix.

  - type: input
    id: name
    attributes:
      label: Component name
      description: PascalCase with the Basis prefix, as it will appear in code.
      placeholder: "e.g. BasisBottomSheet"
    validations:
      required: true

  - type: input
    id: governance
    attributes:
      label: Governance sheet reference
      description: Row in the Components tab plus any related Decisions Log entries. The sheet is the source of truth, so update it alongside this issue.
      placeholder: "e.g. Components tab, row 7"

  - type: textarea
    id: purpose
    attributes:
      label: Purpose & use cases
      description: What does this component do, who uses it, and in which kinds of screens?
    validations:
      required: true

  - type: input
    id: design
    attributes:
      label: Design reference
      description: Figma / sketch / screenshot URL, if there is one
      placeholder: "https://..."

  - type: textarea
    id: composition
    attributes:
      label: Composition
      description: Molecules and atoms used. Link tracking issues for anything that doesn't exist yet.
      placeholder: |
        Molecules:
        - [ ] BasisSearchField (exists)
        - [ ] BasisListItem (needs new → #200)
        Atoms:
        - [ ] BasisSurface (exists)
        - [ ] BasisIconButton (exists)
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: Behavior & interactions
      description: Core behaviors, user flows, gestures, edge cases.
    validations:
      required: true

  - type: textarea
    id: state-data
    attributes:
      label: State & data requirements
      description: State hoisting approach, state holder classes, async data, loading / empty / error states, CompositionLocal dependencies, state restoration across config changes and process death.

  - type: textarea
    id: api
    attributes:
      label: Proposed API
      description: Composable signature, parameter types, defaults, callbacks, slots.
      render: kotlin

  - type: textarea
    id: responsive
    attributes:
      label: Adaptive & layout behavior
      description: Window size classes, orientation, foldables, RTL, edge-to-edge and insets, scrolling and overflow.

  - type: textarea
    id: a11y
    attributes:
      label: Accessibility requirements
      description: Semantics and roles, traversal order, focus management, TalkBack announcements, keyboard / D-pad navigation, back handling.
    validations:
      required: true

  - type: textarea
    id: performance
    attributes:
      label: Performance & size considerations
      description: Parameter stability and skippability, lazy layouts, allocations during composition, animation cost, added dependencies, library size.

  - type: checkboxes
    id: dod
    attributes:
      label: Definition of done
      options:
        - label: Governance sheet updated (Components tab, Decisions Log)
        - label: All molecules/atoms exist or are tracked
        - label: Component implemented
        - label: Verified in light and dark themes
        - label: Compose UI, integration & interaction tests written
        - label: Accessibility checks pass (TalkBack, focus order, font scale, contrast)
        - label: Adaptive layouts verified (window sizes, landscape, RTL, insets)
        - label: Recomposition / stability checked
        - label: "@Preview functions added"
        - label: Screenshot tests added
        - label: Demo app screen added or updated
        - label: KDoc on all public API
        - label: Public API reviewed (naming, visibility, binary compatibility)
        - label: Docs page added (anatomy, live preview, usage guidelines)
        - label: Migration notes (if replacing an existing component)
        - label: Changelog entry added
        - label: Released

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0 – Blocking
        - P1 – High
        - P2 – Medium
        - P3 – Low
      default: 2
    validations:
      required: true

  - type: textarea
    id: related
    attributes:
      label: Related issues / blocked by
      placeholder: "#123, #456"

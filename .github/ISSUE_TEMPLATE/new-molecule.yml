name: "New Molecule (maintainers only)"
description: Maintainers only. Track the design, build, and release of a new Basis molecule (a group of atoms working together)
title: "[Molecule]: "
labels: [ "area: molecule", "type: new", "status: triage" ]
body:
  - type: markdown
    attributes:
      value: |
        > 🔒 **Maintainers only.** Issues opened with this form by anyone without write access are closed automatically.
        > If you'd like to suggest something new, please use the **Report / Request** form instead.

        Use this template to **track** a new molecule: a small, reusable group of atoms that does one job
        (e.g. search field = label + text field + icon button).

        **Title format:** `[Molecule]: BasisSearchField`. Type the molecule's name after the prefix.

  - type: input
    id: name
    attributes:
      label: Molecule name
      description: PascalCase with the Basis prefix, as it will appear in code.
      placeholder: "e.g. BasisSearchField"
    validations:
      required: true

  - type: input
    id: governance
    attributes:
      label: Governance sheet reference
      description: Row in the Molecules tab plus any related Decisions Log entries. The sheet is the source of truth, so update it alongside this issue.
      placeholder: "e.g. Molecules tab, row 4"

  - type: textarea
    id: purpose
    attributes:
      label: Purpose & use cases
      description: The single job this molecule performs and where consumers will use it.
    validations:
      required: true

  - type: input
    id: design
    attributes:
      label: Design reference
      description: Figma / sketch / screenshot URL, if there is one
      placeholder: "https://..."

  - type: textarea
    id: atoms
    attributes:
      label: Composed atoms
      description: List the atoms used. Flag any that don't exist yet and link their tracking issues.
      placeholder: |
        - [ ] BasisText (exists)
        - [ ] BasisTextField (exists)
        - [ ] BasisIconButton (needs new atom → #123)
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: Behavior & interactions
      description: How the atoms interact (validation, focus flow, IME actions, clear / submit actions), and the state hoisting approach (stateless core, optional stateful wrapper).
    validations:
      required: true

  - type: textarea
    id: variants
    attributes:
      label: Variants, sizes & states
      placeholder: |
        - layout: Inline | Stacked
        - states: default, focused, error, disabled, loading

  - type: textarea
    id: api
    attributes:
      label: Proposed API
      description: Composable signature, parameter types, defaults, callbacks, slots.
      render: kotlin
      placeholder: |
        @Composable
        fun BasisSearchField(
            query: String,
            onQueryChange: (String) -> Unit,
            onSearch: (String) -> Unit,
            modifier: Modifier = Modifier,
            enabled: Boolean = true,
        )

  - type: textarea
    id: responsive
    attributes:
      label: Layout & adaptive rules
      description: Width constraints, window size class behavior, RTL, font scale, overflow and truncation.

  - type: textarea
    id: a11y
    attributes:
      label: Accessibility requirements
      description: Semantics (merged vs separate nodes), labelling, traversal and focus order, keyboard / D-pad interaction, live-region announcements.
    validations:
      required: true

  - type: checkboxes
    id: dod
    attributes:
      label: Definition of done
      options:
        - label: Governance sheet updated (Molecules tab, Decisions Log)
        - label: All required atoms exist or are tracked
        - label: Molecule implemented
        - label: Verified in light and dark themes
        - label: Compose UI & interaction tests written
        - label: Accessibility checks pass (TalkBack, focus order, font scale, contrast)
        - label: "@Preview functions added"
        - label: Screenshot tests added
        - label: Demo app screen added or updated
        - label: KDoc on all public API
        - label: Public API reviewed (naming, visibility, binary compatibility)
        - label: Docs page added (anatomy, live preview, usage)
        - label: Changelog entry added
        - label: Released

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0 – Blocking
        - P1 – High
        - P2 – Medium
        - P3 – Low
      default: 2
    validations:
      required: true

  - type: textarea
    id: related
    attributes:
      label: Related issues / blocked by
      placeholder: "#123, #456"

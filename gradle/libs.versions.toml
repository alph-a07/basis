[versions]
agp = "9.2.1"
coreKtx = "1.19.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
kotlin = "2.4.20"
composeBom = "2026.09.00"
appcompat = "1.8.0"
material = "1.14.0"
detekt = "1.23.8"
ktlint = "1.8.0"
ktlintGradle = "14.2.0"
lint = "32.2.1"
vanniktechMavenPublish = "0.37.0"
bcv = "0.18.2"
bcvBridge = "0.2.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-lint-api = { group = "com.android.tools.lint", name = "lint-api", version.ref = "lint" }
androidx-lint-checks = { group = "com.android.tools.lint", name = "lint-checks", version.ref = "lint" }
androidx-lint-tests = { group = "com.android.tools.lint", name = "lint-tests", version.ref = "lint" }
android-gradle-plugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
# The Gradle plugin's implementation artifact. A plugin *marker* cannot be used in a
# `dependencies` block, and `build-logic` needs this on its compile classpath to configure
# detekt's extension and task types from the convention plugin.
detekt-gradle-plugin = { group = "io.gitlab.arturbosch.detekt", name = "detekt-gradle-plugin", version.ref = "detekt" }
# The Gradle plugin's implementation artifact, for `build-logic` to configure the `ktlint`
# extension from the convention plugin. Same reasoning as `detekt-gradle-plugin` above.
ktlint-gradle = { group = "org.jlleitschuh.gradle", name = "ktlint-gradle", version.ref = "ktlintGradle" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-lint = { id = "com.android.lint", version.ref = "agp" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
vanniktech-maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktechMavenPublish" }
binary-compatibility-validator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "bcv" }
android-bcv-bridge = { id = "io.github.tjokinen.android-bcv-bridge", version.ref = "bcvBridge" }

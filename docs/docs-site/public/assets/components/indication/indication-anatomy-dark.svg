<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <rect width="640" height="320" fill="#0d1117" />
  
  <!-- Outer interactive container -->
  <rect x="160" y="80" width="320" height="160" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
  
  <!-- State layer (semi-transparent tint conforming to shape) -->
  <rect x="160" y="80" width="320" height="160" rx="16" fill="#58a6ff" fill-opacity="0.10" />
  
  <!-- Expanding ripple wavefront -->
  <defs>
    <radialGradient id="ripple-dark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.25" />
      <stop offset="65%" stop-color="#58a6ff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0.03" />
    </radialGradient>
  </defs>
  <ellipse cx="320" cy="160" rx="60" ry="50" fill="url(#ripple-dark)" stroke="#58a6ff" stroke-width="1" stroke-dasharray="3 3" stroke-opacity="0.5" />
  
  <!-- Center content label -->
  <text x="320" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="middle">Interactive Surface</text>
  <text x="320" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">BasisIndication Feedback</text>
</svg>
